<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>tic tac toe</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="win" class="msgbox">
        <p id="msg">Winner</p>
        <button id="new-bn">New Game</button>
    </div>
    <h1>Tic Tac Toe</h1>
    <div id="container">
        <button class="bn" id="b1"></button>
        <button class="bn" id="b2"></button>
        <button class="bn" id="b3"></button>
        <button class="bn" id="b4"></button>
        <button class="bn" id="b5"></button>
        <button class="bn" id="b6"></button>
        <button class="bn" id="b7"></button>
        <button class="bn" id="b8"></button>
        <button class="bn" id="b9"></button>
    </div>
    <button id="reset">Reset game</button>
    <script src="file.js"></script>
</body>
</html>
